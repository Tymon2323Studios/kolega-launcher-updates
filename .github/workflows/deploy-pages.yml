name: Publish Kolega Launcher update channel
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run release validator tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate signed release assets
        run: python3 tools/validate_release.py site
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
